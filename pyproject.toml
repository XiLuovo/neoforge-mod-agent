[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neoforge-mod-agent"
version = "8.5.0"
description = "LLM-assisted domain-spec generation and repair platform with Minecraft NeoForge ModSpec as the stable plugin, deterministic generation, audit/repair/eval, replay traces, benchmark reports, and portfolio demo artifacts."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
neoforge-agent = "neoforge_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
